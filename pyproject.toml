[project]
name = "test-automation-framework"
version = "0.1.0"
description = "Data-driven API automation testing framework based on Pytest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.13.5",
    "clickhouse-sqlalchemy>=0.3.2",
    "flask>=3.1.0",
    "flask-jwt-extended>=4.7.1",
    "python-jenkins>=1.8.3",
    "jsonpath>=0.82.2",
    "pandas>=2.2.3",
    "paramiko",
    "pymongo",
    "pymysql",
    "pytest>=8.3.2,<9",
    "pyyaml>=6.0.2",
    "redis>=5.2.1",
    "requests>=2.32.3",
    "selenium>=4.27,<5",
    "sqlalchemy>=2.0.36",
    "xlrd>=2.0.1",
    "xlutils>=2.0.0",
    "xlwt>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["base*", "common*", "conf*", "pages*"]
exclude = ["data*", "demo*", "mock_server*", "report*", "testcase*"]
