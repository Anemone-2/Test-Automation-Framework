[pytest]
addopts = -m "not integration"
;addopts = -vs --alluredir ./report/temp -p no:warnings --clean-alluredir
;
;testpaths = ./testcase/

filterwarnings =
    error
    ignore::UserWarning

python_files = test_*.py

python_classes = Test*

python_functions = test

markers =
    api: REST API automation tests
    web: Selenium Web UI automation tests
    snipeit: tests that require the local Snipe-IT environment
    smoke: 核心业务链路冒烟测试
    regression: 完整回归测试
    integration: 需要项目专用真实数据库环境的集成测试
