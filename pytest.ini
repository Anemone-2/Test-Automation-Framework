[pytest]
addopts = -ra
testpaths = testcase/snipeit

filterwarnings =
    error
    ignore::UserWarning

python_files = test_*.py

python_classes = Test*

python_functions = test_*

markers =
    api: REST API automation tests
    web: Selenium Web UI automation tests
    snipeit: tests that require the local Snipe-IT environment
    smoke: 核心业务链路冒烟测试
    regression: 完整回归测试
