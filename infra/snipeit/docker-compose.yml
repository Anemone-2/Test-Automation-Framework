name: test-automation-snipeit

services:
  app:
    image: snipe/snipe-it:${APP_VERSION:-v8.6.3}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - snipeit_storage:/var/lib/snipeit
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - "${SNIPEIT_RUNTIME_ENV_FILE:-.env}"

  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_HOST_PORT:-13307}:3306"
    volumes:
      - snipeit_mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 20s

volumes:
  snipeit_mysql_data:
    name: test-automation-snipeit_mysql_data
  snipeit_storage:
